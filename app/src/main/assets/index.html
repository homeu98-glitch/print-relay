<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>POS Printer Demo</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a222c; --panel2: #232d3a; --line: #334155;
      --text: #e8eef6; --muted: #94a3b8; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
      --front: #60a5fa; --bar: #a78bfa; --kitchen: #fb923c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: sans-serif; color: var(--text);
      background: var(--bg); padding: 10px 10px 28px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 2px; }
    .local-ip { color: var(--ok); font-size: 0.82rem; font-family: monospace; margin: 0 0 8px; }
    .hub-url {
      font-family: monospace; font-size: 0.95rem; color: var(--ok);
      word-break: break-all; margin: 0 0 4px;
    }
    .qr-wrap { display: flex; justify-content: center; margin: 8px 0; }
    #pairQr {
      display: none; width: 200px; height: 200px;
      background: #fff; padding: 8px; border-radius: 8px;
    }
    .hint { color: var(--muted); font-size: 0.75rem; margin: 0; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px;
    }
    h2 { font-size: 0.92rem; margin: 0 0 6px; }
    .status { color: var(--ok); font-size: 0.78rem; min-height: 1em; margin-top: 4px; }
    .device { background: var(--panel2); border-radius: 8px; padding: 8px; margin-bottom: 6px; }
    .mac { font-family: monospace; font-size: 0.75rem; color: #cbd5e1; }
    .pill {
      display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.72rem; font-weight: 700;
    }
    .pill.front { background: rgba(96,165,250,.15); color: var(--front); }
    .pill.bar { background: rgba(167,139,250,.15); color: var(--bar); }
    .pill.kitchen { background: rgba(251,146,60,.15); color: var(--kitchen); }
    .pill.none { background: rgba(148,163,184,.12); color: var(--muted); }
    .log {
      background: #0b1220; border: 1px solid var(--line); border-radius: 8px;
      height: 110px; overflow: auto; font-family: monospace; font-size: 0.72rem;
      padding: 6px; color: #cbd5e1;
    }
    .log .warn { color: var(--warn); }
  </style>
</head>
<body>
  <h1>POS 印表機 Demo</h1>
  <p class="local-ip" id="localIp">本機 IP：偵測中…</p>

  <div class="card">
    <h2>區網 Hub</h2>
    <p class="hub-url" id="hubUrl">啟動中…</p>
    <div class="qr-wrap"><img id="pairQr" alt="配對 QR Code" /></div>
    <p class="hint">手機打開 GitHub 測試頁掃描此 QR。設定印表機會導向本機網頁；出單由 Hub 依綁定分送。</p>
    <div class="status" id="hubStatus"></div>
  </div>

  <div class="card">
    <h2>Web 送來的指令</h2>
    <p class="hub-url" id="lastWeb">尚無</p>
    <div class="log" id="webLog"></div>
  </div>

  <div class="card">
    <h2>已綁定設備</h2>
    <div id="list"></div>
  </div>

  <script>
    const SERVICES = {
      front: { label: '前台', cls: 'front' },
      bar: { label: '水吧', cls: 'bar' },
      kitchen: { label: '廚房', cls: 'kitchen' },
    };

    function setLocalIp(ip) {
      document.getElementById('localIp').textContent = ip ? '本機 IP：' + ip : '本機 IP：無法偵測';
    }

    let lastQrUrl = '';
    function setHub(boot) {
      const el = document.getElementById('hubUrl');
      const st = document.getElementById('hubStatus');
      const qr = document.getElementById('pairQr');
      if (boot.hubUrl) {
        el.textContent = boot.hubUrl;
        st.textContent = boot.hubListening ? 'Hub 已在聽取' : 'Hub 啟動中…';
        if (boot.hubUrl !== lastQrUrl) {
          lastQrUrl = boot.hubUrl;
          try {
            qr.src = PosNative.getPairQrDataUrl();
            qr.style.display = 'block';
          } catch (e) { qr.style.display = 'none'; }
        }
      } else {
        el.textContent = '無法偵測 IP（請連 Wi‑Fi）';
        st.textContent = '';
        qr.style.display = 'none';
        lastQrUrl = '';
      }
    }

    function logWeb(text, warn) {
      const box = document.getElementById('webLog');
      const div = document.createElement('div');
      const t = new Date().toLocaleTimeString('zh-TW', { hour12: false });
      div.className = warn ? 'warn' : '';
      div.textContent = '[' + t + '] ' + text;
      box.prepend(div);
    }

    window.onWebCommand = (serviceId, label, message, printed) => {
      const line = '給' + label + '｜' + message;
      document.getElementById('lastWeb').textContent = line;
      logWeb(line + (printed > 0 ? '（已出紙）' : '（無印表機，僅記錄）'), printed <= 0);
    };

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render(devices) {
      const root = document.getElementById('list');
      if (!devices.length) {
        root.innerHTML = '<div style="color:var(--muted)">尚無綁定。請用手機 print.html 進入設定頁掃描。</div>';
        return;
      }
      root.innerHTML = devices.map(d => {
        const svc = SERVICES[d.service];
        const pill = svc
          ? '<span class="pill ' + svc.cls + '">' + svc.label + '</span>'
          : '<span class="pill none">未指定</span>';
        const raw = d.canRawPrint ? '可 raw 列印' : '無 9100';
        return '<div class="device"><div><b>' + escapeHtml(d.name) + '</b> ' + pill +
          '</div><div class="mac">IP ' + escapeHtml(d.ip) + ' · ' + raw + '</div></div>';
      }).join('');
    }

    function applyBoot() {
      const boot = JSON.parse(PosNative.getBootstrapJson());
      setLocalIp(boot.localIp || '');
      setHub(boot);
      render(boot.devices || []);
    }

    try { applyBoot(); } catch (e) {}
    setInterval(() => { try { applyBoot(); } catch (e) {} }, 2000);
  </script>
</body>
</html>
